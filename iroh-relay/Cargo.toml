[package]
name = "iroh-relay"
version = "1.5.0"
edition = "2024"
readme = "README.md"
description = "A transparent QUIC relay server and client, forked from iroh's relay"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh"
keywords = ["networking", "holepunching", "p2p"]
rust-version = "1.91"

[lints]
workspace = true

[dependencies]
bytes = "1.11"
data-encoding = "2.6.0"
derive_more = { version = "2.0.1", features = [
    "debug",
    "display",
    "from",
    "try_into",
    "deref",
] }
http = "1"
http-body-util = "0.1.0"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.5", features = ["tokio"] }
iroh-dns = { version = "1.4.1", path = "../iroh-dns", optional = true }
iroh-metrics = { version = "1.0.2", default-features = false }
n0-error = "1.0.0"
n0-future = "0.3"
percent-encoding = "2.3"
pin-project = "1"
noq = { version = "1.4.0", default-features = false, features = ["rustls"] }
noq-proto = { version = "1.4.0", default-features = false }
rand = "0.10"
rustls = { version = "0.23.46", default-features = false }
rustls-platform-verifier = { version = "0.7.0", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "sync",
    "rt",
    "net",
    "fs",
    "io-std",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"] }
tokio-util = { version = "0.7", features = ["io-util", "io", "codec", "rt"] }
tokio-websockets = { version = "0.13", features = ["rustls-bring-your-own-connector", "getrandom", "rand", "client", "sha1_smol"] }
tracing = "0.1"
url = { version = "2.5.3", features = ["serde"] }
webpki-roots = "1.0.3"
webpki_types = { package = "rustls-pki-types", version = "1.12" }

# server feature
clap = { version = "4", features = ["derive"], optional = true }
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "native-tokio", "tls12"], optional = true }
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring"], optional = true }
n0-mainline = { version = "0.7.1", optional = true }
rcgen = { version = "0.14", optional = true }
reloadable-state = { version = "0.1", optional = true }
rustls-cert-reloadable-resolver = { version = "0.7.1", optional = true }
rustls-cert-file-reader = { version = "0.4.2", optional = true }
time = { version = "0.3.37", optional = true }
tokio-rustls-acme = { version = "0.9", optional = true }
toml = { version = "1.0", optional = true }
x509-parser = { version = "0.18", optional = true }
sha1 = { version = "0.11.0", optional = true }
serde_json = { version = "1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14", features = ["x509-parser"] }
proptest = "1.11.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = [
    "io-util",
    "sync",
    "rt",
    "net",
    "fs",
    "macros",
    "time",
    "test-util",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
n0-tracing-test = "0.3"

[build-dependencies]
cfg_aliases = "0.2.2"

[features]
default = ["metrics", "tls-ring", "dns"]
# The client resolves host names with a DNS resolver of its own instead of the
# operating system's.
dns = ["dep:iroh-dns"]
# Enables fetching TLS trust anchors from the operating system
platform-verifier = ["dep:rustls-platform-verifier"]
server = [
    "metrics",
    "tokio/signal",
    "tokio/rt-multi-thread",
    "dep:clap",
    "dep:hyper-rustls",
    "dep:instant-acme",
    "dep:x509-parser",
    "hyper-util/client-legacy",
    "hyper-util/http1",
    "hyper-util/tokio",
    "dep:rcgen",
    "dep:reloadable-state",
    "dep:rustls-cert-file-reader",
    "dep:rustls-cert-reloadable-resolver",
    "dep:time",
    "dep:tokio-rustls-acme",
    "tokio-websockets/server",
    "dep:sha1",
    "dep:toml",
    "dep:serde_json",
    "dep:tracing-subscriber",
    "noq/platform-verifier",
    "noq/runtime-tokio",
    "iroh-metrics/service",
    "tls-ring",
]
# Lets the relay announce and look up peers on the mainline DHT for its clients.
dht = ["server", "dep:n0-mainline"]
metrics = ["iroh-metrics/metrics"]
test-utils = []
tls-ring = [
    "noq/ring",
    "rustls/ring",
    "tokio-rustls/ring",
    "tokio-websockets/ring",
    "iroh-dns?/tls-ring",
]
tls-aws-lc-rs = [
    "noq/aws-lc-rs",
    "rustls/aws-lc-rs",
    "tokio-rustls/aws-lc-rs",
    "tokio-websockets/aws_lc_rs",
    "iroh-dns?/tls-aws-lc-rs",
]

[[test]]
name = "control"
required-features = ["server", "test-utils"]

[[test]]
name = "acme_ip"
required-features = ["server", "test-utils"]

[[test]]
name = "dht"
required-features = ["server", "dht", "test-utils"]

[[test]]
name = "tunnel"
required-features = ["server", "test-utils"]

[[test]]
name = "socket"
required-features = ["server", "test-utils"]

[[bin]]
name = "iroh-relay"
path = "src/main.rs"
required-features = ["server"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "iroh_docsrs"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # workspace crates
    "iroh_dns::*",
    # crates owned by us that will move to 1.0 as well
    "iroh_metrics::*",
    "n0_error::*",
    "noq::*",
    "noq_proto::*",
    # 1.0 crates that we deem fine to be part of the public API
    "bytes::*",
    "http::*",
    "http_body::*",
    "hyper::*",
    "rustls_pki_types::*",
    "serde_core::*",
    "tokio::*",
    "url::*",
    # non-1.0 crates that we decided to accept in the public API
    "rustls::*",
    "tokio_rustls::*",
    "futures_core::stream::Stream",
    "futures_sink::Sink",
]
